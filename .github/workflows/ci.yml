name: CI/CD — EduPlatform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  # ──────────────────────────────────────────────
  # Gate 1 — Code quality (lint + typecheck)
  # ──────────────────────────────────────────────
  lint:
    name: 🔍 Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit -p .

  # ──────────────────────────────────────────────
  # Gate 2 — Test runner (subagente test-runner)
  # Equivalente al subagente .claude/agents/test-runner.md
  # ──────────────────────────────────────────────
  test:
    name: 🧪 Test Runner
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Unit tests (Vitest)
        run: npm run test

  # ──────────────────────────────────────────────
  # Gate 3 — Code review (subagente code-reviewer)
  # Solo corre en Pull Requests
  # ──────────────────────────────────────────────
  code-review:
    name: 📋 Code Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Analizar diff del PR
        run: |
          echo "=== Archivos modificados en este PR ==="
          git diff --name-only origin/main...HEAD

          echo ""
          echo "=== Verificando archivos problemáticos comunes ==="
          # Verificar secrets expuestos
          if git diff origin/main...HEAD | grep -iE '(api_key|secret|password|token)\s*[:=]\s*["\x27][A-Za-z0-9]'; then
            echo "❌ Posible secret expuesto detectado en el diff"
            exit 1
          fi

          # Verificar imports de admin.ts en client components
          CHANGED_COMPONENTS=$(git diff --name-only origin/main...HEAD | grep 'src/components/.*\.tsx$' || true)
          for f in $CHANGED_COMPONENTS; do
            if grep -q "from.*supabase/admin" "$f" 2>/dev/null; then
              echo "❌ $f importa admin.ts (service-role) — no debe usarse en componentes client"
              exit 1
            fi
          done

          # Verificar que no hay console.log en código nuevo
          NEW_LOGS=$(git diff origin/main...HEAD | grep '^+' | grep 'console\.log' | grep -v 'test' || true)
          if [ -n "$NEW_LOGS" ]; then
            echo "⚠️  console.log encontrado en código nuevo:"
            echo "$NEW_LOGS"
          fi

          echo ""
          echo "✅ Verificación de code review completada"

  # ──────────────────────────────────────────────
  # Deploy — Solo si todos los gates pasan + push a main
  # ──────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy a Vercel
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: success() && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy a Vercel (producción)
        run: npx vercel deploy --prod --yes --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  # ──────────────────────────────────────────────
  # Deploy preview — Solo en PRs
  # ──────────────────────────────────────────────
  deploy-preview:
    name: 🔎 Deploy Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Deploy a Vercel (preview)
        run: npx vercel deploy --yes --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
